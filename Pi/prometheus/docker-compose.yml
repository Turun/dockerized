services:
  prompushgateway:
    container_name: "prompushgateway"
    build: "."          # replaces prom/pushgateway — ours accepts timestamps
    restart: "unless-stopped"
    expose:
      - 9091
    networks:
      - dockeronly

  prometheus:
    container_name: "prometheus"
    image: "prom/prometheus:latest"
    restart: "unless-stopped"
    expose:
      - 9090
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=10y"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "/data/prometheus:/prometheus"
    networks:
      - internet
      - dockeronly

networks:
  dockeronly:
    name: "dockeronly"
    internal: true
    attachable: true
  internet:
    name: "internet"
