
services:
  prompushgateway:
    container_name: "prompushgateway"
    image: "prom/pushgateway:latest"
    restart: "unless-stopped"
    expose:
      - 9091
    # persistence could be added like this:
    # command:
    #   - "--persistence.file=/pushgateway/persist"
    # volumes:
    #   - "/data/pushgateway:/pushgateway"
    networks:
      - dockeronly

  prometheus:
    container_name: "prometheus"
    image: "prom/prometheus:latest"
    restart: "unless-stopped"
    expose:
      - 9090
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=10y"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "/data/prometheus:/prometheus"
    networks:
      - internet
      - dockeronly

networks:
  dockeronly:
    name: "dockeronly"
    internal: true
    attachable: true
  internet:
    name: "internet"

