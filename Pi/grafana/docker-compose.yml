
services:
  grafana:
    container_name: "grafana"
    image: "grafana/grafana-oss:latest-ubuntu"
    restart: "unless-stopped"
    expose:
      - 3000
    volumes:
      - "/data/grafana:/var/lib/grafana"
    networks:
      - dockeronly

networks:
  dockeronly:
    name: "dockeronly"
    internal: true
    attachable: true

