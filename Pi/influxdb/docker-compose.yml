# The receiver then writes to /write?db=smartmeter, Grafana reads via
# the built-in InfluxDB datasource plugin (URL http://influxdb:8086,
# db smartmeter, no credentials — LAN-internal, like the rest).
services:
  influxdb:
    container_name: "influxdb"
    image: "influxdb:1.8"
    restart: "unless-stopped"
    expose:
      - 8086
    environment:
      # Quiet-ish logging; the web UI is disabled (Grafana is our UI).
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      INFLUXDB_HTTP_LOG_ENABLED: "false"
      INFLUXDB_DATA_QUERY_LOG_ENABLED: "false"
      # Retention: keep raw data forever
      INFLUXDB_RETENTION_ENABLED: "false"
    volumes:
      - "/data/influxdb:/var/lib/influxdb"
      # Runs once on first start: creates the database.
      - "./influxdb-init.iql:/docker-entrypoint-initdb.d/influxdb-init.iql:ro"
    networks:
      - dockeronly

networks:
  dockeronly:
    name: "dockeronly"
    internal: true
    attachable: true
